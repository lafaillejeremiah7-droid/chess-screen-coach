<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Screen Coach status</title>
<style>
  body{width:320px;min-height:170px;box-sizing:border-box;margin:0;padding:14px;font:14px/1.4 system-ui,sans-serif;background:#14202a;color:#fff}
  h1{margin:0 0 10px;font-size:17px}
  #suggestion{border:1px solid #778799;border-radius:7px;background:#203344;padding:12px;min-height:38px;overflow-wrap:anywhere}
  #detail{margin:9px 0;color:#e0e8f0;font-size:12px;overflow-wrap:anywhere}
  .actions{display:flex;flex-wrap:wrap;gap:7px}
  button{border:1px solid #90b4d5;background:#294d6b;color:#fff;border-radius:6px;padding:8px 10px;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<h1>Chess Screen Coach <small>v0.7.7 — standalone</small></h1>
<div id="suggestion" role="status" aria-live="polite">Checking this tab…</div>
<p id="detail">Checking whether the page script is loaded.</p>
<div class="actions">
  <button id="resync" type="button">Resync board</button>
  <button id="repair" type="button">Repair display</button>
  <button id="resume" type="button">Resume</button>
  <button id="refresh" type="button">Refresh status</button>
</div>
<script src="popup.js"></script>
</body>
</html>
