name: Full Stockfish 19 extension
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --prefix standalone --no-audit --no-fund
      - name: Build Full Stockfish 19 extension
        run: npm run build --prefix standalone
      - name: Test engine, extension bridge, and board reader
        run: |
          npm test --prefix standalone
          node --test tests/current-board.test.mjs tests/content.test.mjs
      - name: Save extension
        uses: actions/upload-artifact@v4
        with:
          name: full-stockfish-19-v0.8.0
          path: dist/extension/
          if-no-files-found: error
          retention-days: 90
