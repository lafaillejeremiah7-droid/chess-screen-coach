name: Standalone Chrome extension build
on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'standalone/**'
      - '.github/workflows/standalone-extension.yml'
  pull_request:
    paths:
      - 'extension/**'
      - 'standalone/**'
      - '.github/workflows/standalone-extension.yml'
  workflow_dispatch:
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser dependencies
        run: npm install --prefix standalone --no-audit --no-fund
      - name: Build self-contained extension
        run: npm run build --prefix standalone
      - name: Test browser-side chess tracking and packaging
        run: npm test --prefix standalone
      - name: Run repository regression tests
        run: npm test
      - name: Save unpacked standalone extension
        uses: actions/upload-artifact@v4
        with:
          name: chess-screen-coach-standalone-full-v0.7.11
          path: dist/extension/
          if-no-files-found: error
          retention-days: 90
