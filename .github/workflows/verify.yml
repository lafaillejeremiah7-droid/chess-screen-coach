name: Verify Chess Screen Coach

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run browser and extension unit tests
        run: npm test
      - name: Install Python chess dependency
        run: pip install -r requirements.txt
      - name: Run Python chess and API unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
