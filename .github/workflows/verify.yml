name: Verify Chess Screen Coach

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run browser and extension unit tests
        run: |
          node --check extension/board.js
          node --check extension/content.js
          node --check extension/background.js
          node --check extension/options.js
          node --check src/app.js
          node --check src/recognition.js
          node --check src/training.js
          node --check src/sparring.js
          npm test
      - name: Install Python chess dependency
        run: pip install -r requirements.txt
      - name: Run Python chess and API unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install checksum-verified Stockfish 19
        run: python scripts/install_stockfish19.py
      - name: Verify Stockfish 19 identity and legal one-second move
        run: python scripts/check_stockfish19_ready.py
      - name: Verify real engine and localhost HTTP API
        run: |
          python - <<'PY'
          import json
          import threading
          import urllib.error
          import urllib.request
          from http.server import ThreadingHTTPServer
          import chess
          import chess.engine
          import server

          server.ENGINE = chess.engine.SimpleEngine.popen_uci(server.stockfish_location())
          server.configure_main_engine(server.ENGINE)
          http = ThreadingHTTPServer(("127.0.0.1", 0), server.Handler)
          thread = threading.Thread(target=http.serve_forever, daemon=True)
          thread.start()
          base = f"http://127.0.0.1:{http.server_port}"

          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  base + path, data=data,
                  headers={"Content-Type": "application/json"} if data else {})
              with urllib.request.urlopen(req, timeout=10) as response:
                  return response.status, json.loads(response.read())

          try:
              status, health = request("/api/health")
              assert status == 200 and health["python"] and health["stockfish"]
              assert health["default_elo"] == 1400 and health["strength_limited"]
              board = chess.Board()
              status, answer = request("/api/analyze", {"fen": board.fen()})
              move = chess.Move.from_uci(answer["from"] + answer["to"])
              assert status == 200 and move in board.legal_moves
              assert answer["instruction"].startswith("Move ")
              print("Real Stockfish:", answer["instruction"])
              # Training must temporarily use unrestricted evaluations and
              # leave the main 1400-UCI-Elo coach usable afterward.
              status, training = request("/api/training/evaluate",
                                         {"fen": board.fen(), "move": "e2e4"})
              assert status == 200 and training["best"] in [
                  move.uci() for move in board.legal_moves]
              status, again = request("/api/analyze", {"fen": board.fen()})
              assert status == 200 and again["from"] and again["to"]
              after = board.copy()
              after.push_uci("e2e4")
              status, tracked = request("/api/track", {
                  "previous": board.fen(), "placement": after.board_fen()})
              assert status == 200 and tracked["fen"] == after.fen()
              try:
                  request("/api/analyze", {"fen": "not a fen"})
                  raise AssertionError("Invalid FEN was accepted")
              except urllib.error.HTTPError as error:
                  assert error.code == 400
              print("HTTP health, analyze, tracking, invalid-input checks: passed")
          finally:
              http.shutdown()
              http.server_close()
              server.ENGINE.quit()
              server.ENGINE = None
          PY
      - name: Empirical 1400-Elo strength audit at 1 second per move
        run: python scripts/audit_main_1400.py --positions 24 --seconds 1 --output main_1400_strength_audit.json
      - name: Save strength-audit results
        uses: actions/upload-artifact@v4
        with:
          name: main-1400-strength-audit
          path: main_1400_strength_audit.json
          if-no-files-found: error
