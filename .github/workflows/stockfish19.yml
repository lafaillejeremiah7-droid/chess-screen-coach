name: Stockfish 19 baseline and A/B verification

on:
  push:
    branches: [feature/stockfish19-baseline-ab]
  pull_request:
    paths:
      - scripts/install_stockfish19.py
      - scripts/compare_engines.py
      - server.py
      - tests/**
      - .github/workflows/stockfish19.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test checksum-safe installation without downloading binaries
        run: python -m unittest discover -s tests -p 'test_install_stockfish19.py' -v
      - name: Install official verified Stockfish 19
        run: python scripts/install_stockfish19.py
      - name: Check UCI engine version
        run: |
          printf 'uci\nquit\n' | .stockfish/bin/stockfish | grep '^id name Stockfish 19'
      - name: Install Python chess dependencies
        run: python -m pip install -r requirements.txt
      - name: Python coach and tracking unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify Stockfish 19 calculates a legal move in exactly the one-second configured budget
        run: python scripts/check_stockfish19_ready.py
      - name: A/B infrastructure smoke test (not an Elo test)
        run: |
          python scripts/compare_engines.py \
            --baseline .stockfish/bin/stockfish \
            --candidate .stockfish/bin/stockfish \
            --games 2 --seconds 0.02 --max-plies 12 \
            --output engine_ab_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: sf19-ab-smoke-report
          path: engine_ab_report.json
