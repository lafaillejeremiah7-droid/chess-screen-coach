name: Million-game self-play campaign

on:
  push:
    branches: [experiment/million-game-selfplay]
    paths:
      - scripts/selfplay_campaign.py
      - scripts/install_campaign_engine.py
      - tests/test_selfplay_campaign.py
      - .github/workflows/selfplay-million.yml
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Run containing the last checkpoint (blank finds latest)
        type: string
        default: ''
      batch_seconds:
        description: Seconds for this batch (60 to 10800)
        type: string
        default: '10800'
      continue_campaign:
        description: Continue in another batch until one million games finish
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: million-game-selfplay
  cancel-in-progress: false

jobs:
  campaign:
    # Use only standard public-repository runners. This is an offline test of
    # this repository's chess engine, not a deployment of a learned policy.
    if: github.event.repository.private == false && github.ref == 'refs/heads/experiment/million-game-selfplay'
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-chess==1.999 chess==1.11.2
      - run: python -m unittest discover -s tests -p 'test_selfplay_campaign.py'
      - run: python scripts/install_campaign_engine.py
      - name: Locate checkpoint
        id: previous
        uses: actions/github-script@v7
        env:
          RESUME_RUN: ${{ inputs.resume_run_id }}
        with:
          script: |
            const explicit = process.env.RESUME_RUN;
            if (explicit) {
              if (!/^\d+$/.test(explicit)) throw new Error('Invalid checkpoint run ID');
              core.setOutput('run', explicit);
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name: 'million-game-checkpoint', per_page: 100
            });
            const candidates = artifacts.filter(a => !a.expired &&
              a.workflow_run?.head_branch === 'experiment/million-game-selfplay');
            candidates.sort((a,b) => b.id-a.id);
            if (candidates.length) core.setOutput('run', candidates[0].workflow_run.id);
            else {
              const runs = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'selfplay-million.yml',
                branch: 'experiment/million-game-selfplay', per_page: 20
              });
              const earlier = runs.data.workflow_runs.filter(r => r.id !== context.runId);
              if (earlier.length) throw new Error('Prior run exists but no checkpoint is available; refusing to reset progress');
              core.setOutput('run', '');
            }
      - name: Restore checkpoint
        if: steps.previous.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: million-game-checkpoint
          path: checkpoint-download
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run }}
      - name: Unpack checkpoint
        if: steps.previous.outputs.run != ''
        run: |
          mkdir -p campaign
          python - <<'PY'
          import gzip,shutil
          with gzip.open('checkpoint-download/campaign.sqlite3.gz','rb') as src, open('campaign/campaign.sqlite3','wb') as dst:
              shutil.copyfileobj(src,dst)
          PY
      - name: Play and learn at one second per move
        id: play
        env:
          BATCH_SECONDS: ${{ inputs.batch_seconds || '180' }}
        run: |
          python - <<'PY'
          import os,subprocess,sys
          seconds=int(os.environ['BATCH_SECONDS'])
          if not 60 <= seconds <= 10800:
              raise SystemExit('Batch length must be between 60 and 10800 seconds')
          workers=min(4,os.cpu_count() or 1)
          print(f'Campaign workers: {workers}',flush=True)
          subprocess.run([sys.executable,'-u','scripts/selfplay_campaign.py',
              '--engine','.campaign-engine/stockfish','--games','1000000',
              '--seconds','1','--teacher-seconds','1.5','--workers',str(workers),
              '--max-seconds',str(seconds),'--output','campaign'],check=True)
          PY
      - name: Make a consistent checkpoint and summary
        if: always()
        id: checkpoint
        run: |
          python - <<'PY'
          import gzip,json,os,shutil,sqlite3,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import selfplay_campaign as c
          source=Path('campaign/campaign.sqlite3')
          if not source.exists():
              print('No checkpoint database created')
              raise SystemExit(0)
          dest=Path('checkpoint-upload'); dest.mkdir(exist_ok=True)
          src=sqlite3.connect(source); backup=sqlite3.connect(dest/'campaign.sqlite3')
          src.backup(backup); backup.close()
          config=json.loads(src.execute("SELECT value FROM metadata WHERE key='config'").fetchone()[0])
          report=c.status(src,config); src.close()
          (dest/'summary.json').write_text(json.dumps(report,indent=2)+'\n')
          with (dest/'campaign.sqlite3').open('rb') as inp, gzip.open(dest/'campaign.sqlite3.gz','wb',compresslevel=9) as out:
              shutil.copyfileobj(inp,out)
          (dest/'campaign.sqlite3').unlink()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('ready=true\n')
              out.write(f"remaining={report['remaining']}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write(f"## {report['completed']:,} / {report['target']:,} finished games\n\n")
              out.write(f"State: **{report['state']}**. Pending games: {report['pending']}. Unfinished attempts excluded: {report['unfinished_attempts']}.\n\n")
              out.write('One-second Stockfish 17.1, 1 thread and 16 MiB hash per engine. First 200,000 games train the correction book; the remaining 800,000 are matched controls and frozen candidate tests. No strength gain is established while training is ongoing.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.checkpoint.outputs.ready == 'true'
        id: upload
        with:
          name: million-game-checkpoint
          path: checkpoint-upload/*
          compression-level: 0
          retention-days: 90
          overwrite: true
          if-no-files-found: error
      - name: Retire only superseded campaign checkpoints
        if: success() && steps.upload.outcome == 'success'
        uses: actions/github-script@v7
        env:
          NEW_ARTIFACT: ${{ steps.upload.outputs.artifact-id }}
        with:
          script: |
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name: 'million-game-checkpoint', per_page: 100
            });
            // Keep the new snapshot and one previous backup. Never touch
            // artifacts from another experiment or branch.
            const own = all.filter(a => !a.expired &&
              a.workflow_run?.head_branch === 'experiment/million-game-selfplay');
            own.sort((a,b) => b.id-a.id);
            for (const a of own.slice(2)) {
              await github.rest.actions.deleteArtifact({...context.repo,artifact_id:a.id});
            }
      - name: Continue only after checkpoint upload succeeds
        if: success() && steps.checkpoint.outputs.remaining != '0' && (github.event_name == 'push' || inputs.continue_campaign)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'selfplay-million.yml',
              ref: 'experiment/million-game-selfplay',
              inputs: {resume_run_id: String(context.runId), batch_seconds: '10800', continue_campaign: 'true'}
            });
            core.summary.addRaw('\nNext checkpointed batch requested. Cancel the active campaign run to stop.\n').write();
