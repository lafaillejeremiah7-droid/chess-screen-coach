name: Decision quality proof with real chess games

on:
  push:
    branches: [audit/decision-quality-real-games]
  workflow_dispatch:

jobs:
  verify-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish
      - name: Compile reproducible benchmark
        run: python -m py_compile scripts/benchmark_real_game_decisions.py
      - name: Run 60 real-position chess decision benchmark
        run: python -u scripts/benchmark_real_game_decisions.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-game-decision-quality
          path: decision_quality_real_games.json
