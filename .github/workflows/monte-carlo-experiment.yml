name: Monte Carlo challenger vs current Stockfish

on:
  push:
    branches: [experiment/monte-carlo-vs-stockfish]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install chess library
        run: python -m pip install -r requirements.txt
      - name: Install Stockfish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish
      - name: Check experiment script
        run: python -m py_compile scripts/monte_carlo_experiment.py
      - name: Simulate and compare same-budget chess strategies
        run: python -u scripts/monte_carlo_experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monte-carlo-versus-stockfish-results
          path: monte_carlo_results.json
          if-no-files-found: warn
