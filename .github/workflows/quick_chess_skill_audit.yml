name: Quick chess move agreement audit

on:
  push:
    branches: [audit-move-strength-20261115]

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish
      - name: Time-controlled move agreement test
        run: |
          python - <<'PY'
          import chess,chess.engine,server,statistics
          lines = [
            "e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O",
            "e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5",
            "e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5",
            "e4 c6 d4 d5 Nc3 dxe4 Nxe4 Bf5 Ng3 Bg6 h4 h6",
            "e4 e6 d4 d5 Nc3 Nf6 Bg5 Be7 e5 Nfd7 Bxe7 Qxe7",
            "d4 d5 c4 e6 Nc3 Nf6 Bg5 Be7 e3 O-O Nf3 h6",
            "d4 Nf6 c4 g6 Nc3 Bg7 e4 d6 Nf3 O-O Be2 e5",
            "c4 e5 Nc3 Nf6 g3 d5 cxd5 Nxd5 Bg2 Nb6 Nf3 Nc6",
            "e4 d5 exd5 Qxd5 Nc3 Qa5 d4 c6 Nf3 Nf6 Bc4 Bf5",
            "d4 Nf6 Nf3 d5 Bf4 e6 e3 Bd6 Bg3 O-O Bd3 c5",
            "e4 e5 Nf3 Nc6 d4 exd4 Nxd4 Bc5 Nxc6 bxc6 Bd3",
            "e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nxd5 Nxf7",
            "e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4",
            "e4 e5 f4 exf4 Nf3 g5 h4 g4 Ne5 Nf6 Bc4 d5",
            "d4 Nf6 c4 e6 Nc3 Bb4 e3 O-O Bd3 d5 Nf3 c5"
          ]
          engine=chess.engine.SimpleEngine.popen_uci(server.stockfish_location())
          engine.configure({"Threads":1,"Hash":16})
          print("ENGINE_VERSION",engine.id["name"],flush=True)
          agree=0
          checked=0
          try:
            for i,line in enumerate(lines,1):
              b=chess.Board()
              for san in line.split():
                b.push_san(san)
              if b.is_game_over():continue
              a=engine.play(b,chess.engine.Limit(time=0.2),info=chess.engine.INFO_ALL)
              c=engine.play(b,chess.engine.Limit(time=1.5),info=chess.engine.INFO_ALL)
              same=a.move==c.move
              agree+=int(same);checked+=1
              print("SAMPLE",i,"fast",a.move.uci(),"reference",c.move.uci(),
                "agree",same,"depths",a.info.get("depth"),c.info.get("depth"),flush=True)
          finally:
            engine.quit()
          print("SUMMARY",f"samples={checked}",f"exact_move_agreement={agree}/{checked}",
            f"agreement_pct={100*agree/checked:.1f}",flush=True)
          PY
