name: Self-play evaluation at production one-second budget

on:
  push:
    branches: [experiment/selfplay-one-second]
  workflow_dispatch:

jobs:
  controlled-one-second:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish
      - run: python -m py_compile scripts/selfplay_agent2.py scripts/selfplay_one_second.py
      - name: Train and compete at one second per player
        run: python -u scripts/selfplay_one_second.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-second-agent1-vs-agent2
          path: |
            selfplay_one_second.json
            selfplay_one_second.pgn
          if-no-files-found: warn
