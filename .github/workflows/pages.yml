name: Verify Python chess coach
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q server.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/app.js
      - run: node --check src/training.js
      - run: node --check extension/board.js
      - run: node --check extension/content.js
      - run: node --check extension/background.js
      - run: npm test
