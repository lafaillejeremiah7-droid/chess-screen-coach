name: Monte Carlo paired match tournament

on:
  push:
    branches: [experiment/monte-carlo-matches]
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish
      - run: python -m py_compile scripts/monte_carlo_experiment.py scripts/monte_carlo_matches.py
      - name: Play paired legal Monte Carlo games vs Stockfish
        run: python -u scripts/monte_carlo_matches.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-monte-carlo-matches
          path: |
            monte_carlo_matches.json
            monte_carlo_matches.pgn
          if-no-files-found: warn
